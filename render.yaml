# Render Blueprint — web service + hourly cron job
# https://render.com/docs/blueprint-spec
#
# 1. Push repo to GitHub
# 2. Render → New → Blueprint → select this repo
# 3. Fill ALERT_EMAIL, RESEND_API_KEY, PERX_*, DASHBOARD_URL in the dashboard
# 4. Disk mounts at /app/data for SQLite + browser session

services:
  - type: web
    name: windstar-tahiti-tracker
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8765"
      - key: DISABLE_LOCAL_SCHEDULER
        value: "1"
      - key: CRON_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: Windstar Tahiti Price Tracker <onboarding@resend.dev>
      - key: ALERT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PERX_USERNAME
        sync: false
      - key: PERX_PASSWORD
        sync: false
      - key: ID90_EMAIL
        sync: false
      - key: ID90_PASSWORD
        sync: false
      - key: DEPARTURE_DATE
        value: "2027-05-20"
      - key: DASHBOARD_URL
        sync: false
    disk:
      name: tracker-data
      mountPath: /app/data
      sizeGB: 1

  - type: cron
    name: windstar-hourly-price-check
    runtime: docker
    plan: starter
    schedule: "0 * * * *"
    dockerCommand: python scripts/cron_ping.py
    envVars:
      - key: CHECK_URL
        fromService:
          name: windstar-tahiti-tracker
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRON_SECRET
        fromService:
          name: windstar-tahiti-tracker
          type: web
          envVarKey: CRON_SECRET
